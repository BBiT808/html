<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열을 오브젝트로 표시~</title>
    <script>
        const verb = [
            "밥먹자",
            "놀자",
            "자자",
            "쉬자",
            "숨쉬자",
            "눕자",
            "게임하자"
        ];
        const noun = ["식사", "놀기", "잠", "휴식", "숨", "눕기", "게임"];

            let obj = {};
            let obj2 = {};

            /* 방법 1 !! */
            verb.forEach((v,i) => obj[noun[i]]= verb[i]);
            console.log(obj);

            /* 방법 2!! */
            for (let i = 0; i< verb.length; i++) {
                obj2[noun[i]] = verb[i];
            }
            console.log(obj2);

            /* 오브젝트를 배열로 */
            const keys = Object.keys(obj);
            console.log(keys);
            const values = Object.values(obj);
            console.log(values);
            const entries = Object.entries(obj);
            console.log(entries)
    </script>
</head>
<body></body>
</html>
